# Hermes owns memory/reflection. This file only records project constraints.

provider: builtin
hindsight_optional: true

store:
  - durable_story_and_editing_lessons
  - verified_source_success_or_failure_patterns
  - chosen_native_openmontage_pipeline_and_runtime
  - rights_and_license_caveats
  - visual_audio_quality_problems_and_fixes
  - final_status_and_project_record_path

never_store:
  - hidden_chain_of_thought
  - credentials
  - unverified_current_event_claims_as_fact
  - legal_safety_claims_for_third_party_footage
  - raw_source_dumps_or_complete_clip_lists

project_record_path: "projects/<project-id>/football_emotion/project_record.json"
