# Football-emotion profile defaults. Run configure_hermes_profile.py or
# `hermes -p football-emotion model` to select a genuinely free endpoint.

model:
  default: ""
  provider: auto

toolsets:
  - web
  - memory
  - session_search
  - skills
  - acd-openmontage

web:
  search_backend: ddgs

plugins:
  enabled:
    - acd-openmontage

memory:
  provider: builtin

display:
  interface: cli
  tool_progress: off

skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  write_approval: false

agent:
  max_turns: 32
  coding_context: off
  max_spawn_depth: 1
  subagent_auto_approve: false

moa:
  enabled: false
