# Football-emotion profile defaults. Run configure_hermes_profile.py or
# `hermes -p football-emotion model` to select a genuinely free endpoint.

model:
  default: ""
  provider: auto

toolsets:
  - file
  - terminal
  - web
  - memory
  - session_search
  - skills

memory:
  provider: builtin

display:
  interface: cli
  tool_progress: off

skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  write_approval: false

agent:
  max_turns: 60
  max_spawn_depth: 1
  subagent_auto_approve: false

moa:
  enabled: false
