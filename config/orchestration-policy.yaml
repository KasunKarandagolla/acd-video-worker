# Thin control-plane policy. Creative/pipeline stages belong to Hermes/OpenMontage.

run_states:
  - INTAKE
  - SOURCE_READY
  - AGENT_RUNNING
  - VALIDATING
  - DELIVERED
  - BLOCKED
  - FAILED

hermes:
  profile: football-emotion
  max_turns: 60
  timeout_seconds: 3600
  preloaded_entry_skills:
    - hermes-openmontage-repo-bridge
    - social-edit-reasoning
    - football-story-strategy

source_policy:
  sequential_acquisition: true
  max_candidates_per_request: 10
  free_only: true
  rights_verification_required: true
  forbid_access_control_bypass: true

delivery:
  require_path_inside_project: true
  require_real_ffprobe: true
  require_video_stream: true
  require_positive_duration: true
  dry_run_can_deliver: false

notifications:
  optional: true
  non_fatal: true
  events: [started, blocked, failed, delivered]
